name: Deploy Pages

# Publishes the `src/` folder as this site's Codeberg Pages copy. Codeberg
# Pages serves static content straight from a `pages` branch root (no
# build step, no arbitrary source folder), so this workflow pushes the
# contents of src/ there on every push to main, alongside a .domains
# file so Codeberg serves it under the same custom domain as GitHub Pages.

on:
  push:
    branches: [main]
    paths: ["src/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish src/ to pages branch
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.codeberg.org"

          cp src/CNAME /tmp/.domains

          git checkout --orphan pages
          git reset --hard
          git checkout main -- src
          find . -maxdepth 1 ! -name . ! -name src ! -name .git -exec rm -rf {} +
          mv src/* .
          rmdir src
          cp /tmp/.domains .domains
          rm -f CNAME

          git add -A
          git commit -m "deploy: publish src/ to pages branch"
          git push --force origin pages
