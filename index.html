<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Path Number Calculator</title>
<style>
  :root {
    --bg: #1d2021;
    --panel: #282828;
    --panel-border: #3c3836;
    --text: #ebdbb2;
    --muted: #a89984;
    --accent: #d79921;
    --accent-soft: rgba(215, 153, 33, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #282828 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    text-align: center;
    font-size: 1.9rem;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 36px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input[type="date"] {
    width: 100%;
    padding: 12px 14px;
    background: #0f1218;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    color-scheme: dark;
  }

  input[type="date"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    background: var(--accent);
    color: #1a1508;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:active { filter: brightness(0.95); }

  #result {
    display: none;
  }

  #result.visible {
    display: block;
  }

  .number-display {
    text-align: center;
    margin-bottom: 24px;
  }

  .number-display .big {
    font-size: 4.5rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .number-display .label {
    color: var(--muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 6px;
  }

  .meaning {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .meaning strong {
    color: var(--accent);
  }

  .breakdown {
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    line-height: 1.7;
    white-space: pre-wrap;
  }

  .breakdown-toggle {
    background: none;
    border: none;
    width: auto;
    margin-top: 14px;
    padding: 0;
    color: var(--muted);
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .breakdown-toggle:hover { filter: none; color: var(--text); }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 30px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Life Path Number</h1>
  <p class="subtitle">Enter your birth date to calculate your numerology life path number.</p>

  <div class="card">
    <label for="birthdate">Date of birth</label>
    <input type="date" id="birthdate" min="1900-01-01">
    <button id="calculate">Calculate</button>
  </div>

  <div class="card" id="result">
    <div class="number-display">
      <div class="big" id="number"></div>
      <div class="label">Life Path Number</div>
    </div>
    <div class="meaning" id="meaning"></div>
    <button class="breakdown-toggle" id="toggleBreakdown">Show calculation</button>
    <div class="breakdown" id="breakdown" style="display:none;"></div>
  </div>

  <footer>Numerology is a symbolic tradition, not a scientific method.</footer>
</div>

<script>
  const MEANINGS = {
    1: "Independence and leadership. You're driven to forge your own path, take initiative, and pioneer new ideas.",
    2: "Partnership and diplomacy. You thrive on cooperation, sensitivity to others, and building harmony.",
    3: "Creativity and self-expression. You're drawn to communication, art, and bringing joy to those around you.",
    4: "Stability and discipline. You value hard work, order, and building things that last.",
    5: "Freedom and change. You seek variety, adventure, and adaptability in life.",
    6: "Nurturing and responsibility. You're oriented toward caretaking, community, and harmony in relationships.",
    7: "Introspection and analysis. You're drawn to inner wisdom, research, and understanding deeper truths.",
    8: "Ambition and material success. You have a natural drive for achievement, authority, and abundance.",
    9: "Humanitarianism and completion. You're guided by compassion, idealism, and a wish to give back.",
    11: "Master Number — intuition and illumination. An intensified 2: spiritual insight paired with the potential to inspire others.",
    22: "Master Number — the master builder. An intensified 4: the discipline to turn big visions into lasting reality.",
    33: "Master Number — the master teacher. An intensified 6: nurturing raised to a selfless, healing calling."
  };

  function reduce(n, steps) {
    while (n > 9 && n !== 11 && n !== 22 && n !== 33) {
      const digits = String(n).split('').map(Number);
      const next = digits.reduce((a, b) => a + b, 0);
      steps.push(`${digits.join(' + ')} = ${next}`);
      n = next;
    }
    return n;
  }

  function calculateLifePath(year, month, day) {
    const steps = [];

    steps.push(`Month: ${month}`);
    const mSteps = [];
    const m = reduce(month, mSteps);
    mSteps.forEach(s => steps.push('  ' + s));
    steps.push(`  -> ${m}`);

    steps.push(`Day: ${day}`);
    const dSteps = [];
    const d = reduce(day, dSteps);
    dSteps.forEach(s => steps.push('  ' + s));
    steps.push(`  -> ${d}`);

    steps.push(`Year: ${year}`);
    const ySteps = [];
    const y = reduce(year, ySteps);
    ySteps.forEach(s => steps.push('  ' + s));
    steps.push(`  -> ${y}`);

    const total = m + d + y;
    steps.push(`Sum: ${m} + ${d} + ${y} = ${total}`);

    const finalSteps = [];
    const result = reduce(total, finalSteps);
    finalSteps.forEach(s => steps.push('  ' + s));

    return { result, breakdown: steps.join('\n') };
  }

  const input = document.getElementById('birthdate');
  const btn = document.getElementById('calculate');
  const resultEl = document.getElementById('result');
  const numberEl = document.getElementById('number');
  const meaningEl = document.getElementById('meaning');
  const breakdownEl = document.getElementById('breakdown');
  const toggleBtn = document.getElementById('toggleBreakdown');

  toggleBtn.addEventListener('click', () => {
    const showing = breakdownEl.style.display !== 'none';
    breakdownEl.style.display = showing ? 'none' : 'block';
    toggleBtn.textContent = showing ? 'Show calculation' : 'Hide calculation';
  });

  btn.addEventListener('click', () => {
    if (!input.value) {
      input.focus();
      return;
    }
    const [year, month, day] = input.value.split('-').map(Number);
    const { result, breakdown } = calculateLifePath(year, month, day);

    numberEl.textContent = result;
    meaningEl.innerHTML = `<strong>${result}</strong> — ${MEANINGS[result] || ''}`;
    breakdownEl.textContent = breakdown;
    breakdownEl.style.display = 'none';
    toggleBtn.textContent = 'Show calculation';
    resultEl.classList.add('visible');
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });
</script>
</body>
</html>
